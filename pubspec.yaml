name: meu_app
description: "App de Correção Automática de Provas — N1 protótipo navegável"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  intl: any
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_database: ^13.0.1
  # N2 — importação CSV, PDF/QR e leitura de QR pela câmera
  file_picker: ^13.3.0
  pdf: ^3.11.3
  printing: ^5.15.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Tipografia da Católica SC (catolicasc.org.br): Poppins no texto,
  # Montserrat nos títulos. Licença OFL em assets/fonts/OFL-*.txt.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
